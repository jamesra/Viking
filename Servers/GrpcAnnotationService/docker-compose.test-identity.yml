# Test stack only: lets grpc-annotation-service trust the self-signed certificate of identity-devtest
# (Servers/IdentityServer/DevTest/docker-compose.yml), whose volume holds it. SSL_CERT_FILE replaces the
# container's CA bundle with that one certificate, so only the test identity server is trusted.
services:
  grpc-annotation-service:
    environment:
      - SSL_CERT_FILE=/identity-devtest-certs/cert.pem
    volumes:
      - identity-devtest-certs:/identity-devtest-certs:ro

volumes:
  identity-devtest-certs:
    external: true
