# Stack: viking-segmentation  (registry: deploy/stacks.psd1; runs on the GPU compute host)
#
# segmentation-server is the bare VIKING_HOSTNAME_SEGMENTATION model (plus the optional demo page
# behind VIKING_HOSTNAME_SEGMENTATIONDEMO). Every other model is a row of models.json
# (<STACK_RUN_DIR>/models.json): one container per row, reached by its own host name that viking-proxy
# routes by SNI. rebuild-and-start.ps1 (stack.ps1 viking-segmentation model <prefix> <file.pt>) writes
# the rows into <STACK_RUN_DIR>/compose.generated.yaml, which stack.ps1 merges after this file. Each
# generated service extends the segmentation-model template below, so the settings every server shares
# (image, GPU, TLS, caches) live in one place.
#
#   stack.ps1 viking-segmentation up
#   docker compose -p viking-segmentation --env-file <host.env> --env-file <run.env> #     -f Servers/SegmentationServer/docker-compose.yml -f <run dir>/compose.generated.yaml up -d --build
#
# TLS: every container presents fullchain.pem and privkey.pem from one folder mounted at /tls, and only
# listens with TLS; it waits SEGMENTATION_TLS_WAIT_SECONDS (120) for the files, exits, and
# `restart: unless-stopped` retries. The folder is the certificate manager's
# ${DOCKER_CERTS_DIR}/${TLS_CERT_NAME}/ (viking-certs restarts the servers, label viking.tls-reload, on
# renewal) unless SEGMENTATION_CERT_DIR points at a folder of your own holding the two files.
#
# Host folders (defaults under STACK_DATA_DIR, override in the run env):
#   SEGMENTATION_MODEL_HOST  weights + <stem>.model.json manifests, mounted read-only at /models
#   SEGMENTATION_CACHE_DIR   per-model torch inductor and tile-embedding caches (each model needs its
#                            own: a server deletes other checkpoints' folders it finds in its cache)

x-segmentation-build: &segmentation-build
  context: ../..
  dockerfile: Servers/SegmentationServer/Dockerfile
  args:
    SOURCE_REVISION: ${STACK_SOURCE_REVISION:-}

x-segmentation-common: &segmentation-common
  build: *segmentation-build
  # VIKING_SEGMENTATION_IMAGE (older name SEGMENTATION_IMAGE) runs a published image instead.
  image: ${VIKING_SEGMENTATION_IMAGE:-${SEGMENTATION_IMAGE:-viking-segmentation-server:latest}}
  restart: unless-stopped
  cap_add:
    - NET_BIND_SERVICE
  gpus: all
  labels:
    viking.tls-reload: "true"
  depends_on:
    segmentation-init:
      condition: service_completed_successfully
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-segmentation-env: &segmentation-env
  TORCHINDUCTOR_CACHE_DIR: /home/user/.cache/torch_inductor
  TORCHINDUCTOR_FX_GRAPH_CACHE: "1"
  TRITON_CACHE_DIR: /home/user/.cache/torch_inductor/triton
  TORCHINDUCTOR_PERSISTENT_AUTOTUNE_DIR: /home/user/.cache/torch_inductor/autotune
  SSL_CERT_PATH: /tls/fullchain.pem
  SSL_KEY_PATH: /tls/privkey.pem
  SEGMENTATION_TLS_WAIT_SECONDS: ${SEGMENTATION_TLS_WAIT_SECONDS:-120}
  # Tile embeddings (not weights). Survives eviction and container restart.
  SEGMENTATION_EMBEDDING_CACHE: /var/cache/segmentation-embeddings
  SEGMENTATION_EMBEDDING_CACHE_MAX_BYTES: ${SEGMENTATION_EMBEDDING_CACHE_MAX_BYTES:-}
  # Uploaded tile bytes, so a tile the GPU cache dropped is rebuilt without asking a client. Disk copies go under the embedding cache.
  SEGMENTATION_TILE_RAM_BYTES: ${SEGMENTATION_TILE_RAM_BYTES:-}
  SEGMENTATION_TILE_CACHE_MAX_BYTES: ${SEGMENTATION_TILE_CACHE_MAX_BYTES:-}
  # 1 writes the newest 40 growth results to <embedding cache>/debug-dumps for offline inspection.
  SEGMENTATION_DEBUG_DUMP: ${SEGMENTATION_DEBUG_DUMP:-}
  # 1 asks SAM2 for three candidate masks on box prompts. Off until judged on real sections.
  SEGMENTATION_BOX_MULTIMASK: ${SEGMENTATION_BOX_MULTIMASK:-0}
  # Identity "segmentation" client: lists the annotation contexts each container is local to, so it reads their
  # tilesets itself instead of asking clients for every cell. It runs only when the client secret and
  # SEGMENTATION_SERVICE_NAME are set; otherwise every cell is left to the clients. The URLs are the
  # host-wide VIKING_IDENTITY_URL / VIKING_IDENTITY_API_URL unless SEGMENTATION_IDENTITY_* override them.
  IdentityServer__Endpoint: ${SEGMENTATION_IDENTITY_ENDPOINT:-${VIKING_IDENTITY_URL:-https://${VIKING_HOSTNAME_IDENTITY:-identity.${VIKING_DOMAIN:-}}/}}
  IdentityServer__ApiEndpoint: ${SEGMENTATION_IDENTITY_API_ENDPOINT:-${VIKING_IDENTITY_API_URL:-https://${VIKING_HOSTNAME_IDENTITY:-identity.${VIKING_DOMAIN:-}}/webapi/}}
  IdentityServer__ClientSecret: ${SEGMENTATION_SERVICE_CLIENT_SECRET:-}

services:
  # One-shot: creates the cache folders and hands them to the image's non-root user, which a
  # freshly created Linux bind mount (owned by root) would otherwise refuse. Harmless on Docker Desktop.
  segmentation-init:
    build: *segmentation-build
    image: ${VIKING_SEGMENTATION_IMAGE:-${SEGMENTATION_IMAGE:-viking-segmentation-server:latest}}
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for d in default; do
        mkdir -p /cache/segmentation-$$d-inductor /cache/segmentation-$$d-embeddings;
        done;
        chown -R user:user /cache
    volumes:
      - ${SEGMENTATION_CACHE_DIR:-${STACK_DATA_DIR:?STACK_DATA_DIR must be set (stack.ps1 exports it)}/cache}:/cache
    restart: "no"

  segmentation-server:
    <<: *segmentation-common
    ports:
      # gRPC over TLS (VIKING_UPSTREAM_SEGMENTATION).
      - "${SEGMENTATION_HTTPS_PORT:-40443}:443"
      # Optional demo page (SEGMENTATION_DEMO_SITE=1), same certificate (VIKING_UPSTREAM_SEGMENTATIONDEMO).
      # Loopback unless SEGMENTATION_DEMO_HOST_BIND=0.0.0.0 (needed when the proxy is on another host).
      - "${SEGMENTATION_DEMO_HOST_BIND:-127.0.0.1}:${SEGMENTATION_DEMO_PORT:-40444}:8443"
    environment:
      <<: *segmentation-env
      SAM2_CHECKPOINT: ${SAM2_CHECKPOINT:-/models/best_TEM_model.pt}
      SEGMENTATION_SERVICE_NAME: ${SEGMENTATION_SERVICE_NAME:-}
      SEGMENTATION_MODEL_NAME: ${SEGMENTATION_MODEL_NAME:-default}
      SEGMENTATION_DEMO_SITE: ${SEGMENTATION_DEMO_SITE:-0}
      SEGMENTATION_DEMO_PLAINTEXT: ${SEGMENTATION_DEMO_PLAINTEXT:-0}
      # The page listens on loopback inside the container unless set to 0.0.0.0; then also set a token.
      SEGMENTATION_DEMO_BIND: ${SEGMENTATION_DEMO_BIND:-127.0.0.1}
      SEGMENTATION_DEMO_TOKEN: ${SEGMENTATION_DEMO_TOKEN:-}
    volumes:
      - ${SEGMENTATION_MODEL_HOST:-${STACK_DATA_DIR}/models}:/models:ro
      - ${SEGMENTATION_CACHE_DIR:-${STACK_DATA_DIR}/cache}/segmentation-default-inductor:/home/user/.cache/torch_inductor
      - ${SEGMENTATION_CACHE_DIR:-${STACK_DATA_DIR}/cache}/segmentation-default-embeddings:/var/cache/segmentation-embeddings
      - ${SEGMENTATION_CERT_DIR:-${DOCKER_CERTS_DIR:?DOCKER_CERTS_DIR must be set (stack.ps1 exports it)}/${TLS_CERT_NAME:-${VIKING_DOMAIN:-viking}}}:/tls:ro

  # Template for the servers generated from models.json; never started itself. Each generated service
  # extends it and adds its weights, ports or network, and caches. The demo page is plain HTTP on port 80
  # for the proxy to route, so it is never published.
  segmentation-model:
    <<: *segmentation-common
    profiles: ["template"]
    environment:
      <<: *segmentation-env
      SEGMENTATION_DEMO_SITE: "1"
      SEGMENTATION_DEMO_PLAINTEXT: "1"
      SEGMENTATION_DEMO_BIND: "0.0.0.0"
    volumes:
      - ${SEGMENTATION_MODEL_HOST:-${STACK_DATA_DIR}/models}:/models:ro
      - ${SEGMENTATION_CERT_DIR:-${DOCKER_CERTS_DIR}/${TLS_CERT_NAME:-${VIKING_DOMAIN:-viking}}}:/tls:ro
