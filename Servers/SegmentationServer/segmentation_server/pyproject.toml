[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation_server"
version = "0.1.0"
description = "Server for the segmentation service"
authors = [
    {name = "James Anderson"}
]
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.71.0",
    "grpcio-tools>=1.71.0",
    "protobuf>=5.29.0",
    "numpy",
    "pillow",
    "opencv-python",
    "torch",
    "sam2",
    "segmentation_grpc",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
segmentation-server = "segmentation_server.__main__:run"

[tool.setuptools]
packages = ["segmentation_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
