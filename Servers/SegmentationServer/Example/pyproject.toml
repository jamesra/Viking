[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-example"
version = "0.1.0"
description = "Example client for the segmentation service"
authors = [
    {name = "James Anderson"}
]
requires-python = ">=3.7"
dependencies = [
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "numpy",
    "pillow",
    "matplotlib",
    "opencv-python",
    "segmentation_grpc",
]

[tool.setuptools]
py-modules = ["client_example"]
