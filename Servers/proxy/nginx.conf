# viking-proxy main config. The nginx image renders /etc/nginx/templates/*.template into
# /etc/nginx/conf.d/ with envsubst at start (VIKING_* and PROXY_* only; see NGINX_ENVSUBST_FILTER in
# docker-compose.yml). This file includes the two rendered files by name, so the image's
# conf.d/default.conf is not loaded and the stream config is not pulled into http {}.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

# Port 443: TLS passthrough. Routes by SNI and never sees plaintext or holds a certificate.
stream {
    include /etc/nginx/conf.d/stream.conf;
}

# Port 80: ACME HTTP-01 webroot, health check, redirect to https (optional plain-HTTP passthrough
# for the legacy IIS host).
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$host" "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    include /etc/nginx/conf.d/http.conf;
}
