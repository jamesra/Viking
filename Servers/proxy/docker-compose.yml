# Stack: viking-proxy  (registry: deploy/stacks.psd1)
#
# The public entry point on the web host. nginx owns host ports 80 and 443:
#   443  TLS passthrough routed by SNI: VIKING_HOSTNAME_<SERVICE> -> VIKING_UPSTREAM_<SERVICE> (host:port);
#        every service presents the shared certificate from /certs itself. Exception: the Identity
#        hostname is terminated here (templates/identity.conf.template) and routed by path so the
#        issuer, management site and WebApi all share https://<identity host>/ on 443:
#          /manage/ -> VIKING_UPSTREAM_IDENTITY_MANAGEMENT   /webapi/ -> VIKING_UPSTREAM_IDENTITY_WEBAPI
#          everything else -> VIKING_UPSTREAM_IDENTITY (issuer)
#   80   /.well-known/acme-challenge/ from the viking-certs webroot (HTTP-01), /healthz, and a
#        redirect to https for everything else.
# Config is templates/*.template rendered by the nginx image's envsubst at container start, so a
# changed hostname or upstream only needs `stack.ps1 restart viking-proxy`.
#
#   stack.ps1 up viking-proxy
#   docker compose -p viking-proxy --env-file <host.env> --env-file <run.env> -f Servers/proxy/docker-compose.yml up -d
#
# Upstream defaults: services on the web host itself are reached as host.docker.internal (mapped
# to the host gateway below, so it also works on Linux). Segmentation lives on VIKING_COMPUTE_HOST
# and the legacy WCF/OData/tiles on VIKING_IIS_HOST. Any VIKING_UPSTREAM_<SERVICE> overrides its default.

x-viking-hostnames: &viking-hostnames
  # Defaults are <label>.${VIKING_DOMAIN}; single-label so one *.${VIKING_DOMAIN} certificate covers all.
  VIKING_HOSTNAME_IDENTITY: ${VIKING_HOSTNAME_IDENTITY:-identity.${VIKING_DOMAIN:?VIKING_DOMAIN must be set}}
  VIKING_HOSTNAME_WEBSVC: ${VIKING_HOSTNAME_WEBSVC:-websvc.${VIKING_DOMAIN}}
  VIKING_HOSTNAME_ANNOTATION: ${VIKING_HOSTNAME_ANNOTATION:-annotation.${VIKING_DOMAIN}}
  VIKING_HOSTNAME_CORRECTIONS: ${VIKING_HOSTNAME_CORRECTIONS:-corrections.${VIKING_DOMAIN}}
  VIKING_HOSTNAME_SEGMENTATION: ${VIKING_HOSTNAME_SEGMENTATION:-segmentation.${VIKING_DOMAIN}}
  VIKING_HOSTNAME_SEGMENTATIONDEMO: ${VIKING_HOSTNAME_SEGMENTATIONDEMO:-segmentationdemo.${VIKING_DOMAIN}}
  VIKING_HOSTNAME_GALLERY: ${VIKING_HOSTNAME_GALLERY:-gallery.${VIKING_DOMAIN}}
  VIKING_HOSTNAME_TEM_GALLERY: ${VIKING_HOSTNAME_TEM_GALLERY:-gallery-tem.${VIKING_DOMAIN}}
  VIKING_HOSTNAME_SEM_GALLERY: ${VIKING_HOSTNAME_SEM_GALLERY:-gallery-sem.${VIKING_DOMAIN}}

services:
  viking-proxy:
    image: nginx:${PROXY_NGINX_TAG:-stable}
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      # Restarted by the cert renewer / `stack.ps1 certs reload` so the Identity listener picks up a new cert.
      viking.tls-reload: "true"
    environment:
      <<: *viking-hostnames
      # Web host services (identity, gRPC annotation, corrections, gallery-router).
      VIKING_UPSTREAM_IDENTITY: ${VIKING_UPSTREAM_IDENTITY:-host.docker.internal:5001}
      VIKING_UPSTREAM_IDENTITY_MANAGEMENT: ${VIKING_UPSTREAM_IDENTITY_MANAGEMENT:-host.docker.internal:4001}
      VIKING_UPSTREAM_IDENTITY_WEBAPI: ${VIKING_UPSTREAM_IDENTITY_WEBAPI:-host.docker.internal:6001}
      # Certificate the Identity listener presents (DOCKER_CERTS_DIR/<name>/ mounted at /certs).
      TLS_CERT_NAME: ${TLS_CERT_NAME:-${VIKING_DOMAIN:-viking}}
      VIKING_UPSTREAM_ANNOTATION: ${VIKING_UPSTREAM_ANNOTATION:-host.docker.internal:5011}
      VIKING_UPSTREAM_CORRECTIONS: ${VIKING_UPSTREAM_CORRECTIONS:-host.docker.internal:41443}
      VIKING_UPSTREAM_GALLERY: ${VIKING_UPSTREAM_GALLERY:-host.docker.internal:8442}
      VIKING_UPSTREAM_TEM_GALLERY: ${VIKING_UPSTREAM_TEM_GALLERY:-host.docker.internal:8442}
      VIKING_UPSTREAM_SEM_GALLERY: ${VIKING_UPSTREAM_SEM_GALLERY:-host.docker.internal:8442}
      # Compute host (viking-segmentation). Its other models are not listed here: `stack.ps1
      # viking-segmentation model` writes their host names and upstreams to models.d/segmentation.map.
      VIKING_UPSTREAM_SEGMENTATION: ${VIKING_UPSTREAM_SEGMENTATION:-${VIKING_COMPUTE_HOST:-host.docker.internal}:40443}
      VIKING_UPSTREAM_SEGMENTATIONDEMO: ${VIKING_UPSTREAM_SEGMENTATIONDEMO:-${VIKING_COMPUTE_HOST:-host.docker.internal}:40444}
      # Legacy IIS host (WCF annotation, OData, DataExport, tiles).
      VIKING_UPSTREAM_WEBSVC: ${VIKING_UPSTREAM_WEBSVC:-${VIKING_IIS_HOST:-host.docker.internal}:443}
      # Unknown SNI names.
      VIKING_UPSTREAM_DEFAULT: ${VIKING_UPSTREAM_DEFAULT:-${VIKING_IIS_HOST:-host.docker.internal}:443}
      # host:port for plain HTTP to the IIS host (e.g. iis-host:80). Empty = websvc on :80 redirects to https.
      VIKING_HTTP_UPSTREAM_WEBSVC: ${VIKING_HTTP_UPSTREAM_WEBSVC:-}
      # Docker's embedded DNS; resolves host.docker.internal, compose service names and public names.
      PROXY_RESOLVER: ${PROXY_RESOLVER:-127.0.0.11}
      # envsubst only these prefixes, so nginx's own $variables are never touched.
      NGINX_ENVSUBST_FILTER: "^(VIKING_|PROXY_|TLS_CERT_NAME)"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates:/etc/nginx/templates:ro
      # Host name -> upstream lines written by other stacks (segmentation.map); included in the SNI map.
      - ${VIKING_PROXY_MODELS_DIR:-${STACK_DATA_DIR:?STACK_DATA_DIR must be set (stack.ps1 exports it)}/models.d}:/etc/nginx/models.d:ro
      # Shared certificates (Identity is the only name TLS-terminated here).
      - ${DOCKER_CERTS_DIR:?DOCKER_CERTS_DIR must be set (stack.ps1 exports it)}:/certs:ro
      # The HTTP-01 webroot viking-certs writes (its STACK_DATA_DIR/webroot).
      - ${VIKING_ACME_WEBROOT:-${NORNIR_DOCKER_USER_ROOT:?NORNIR_DOCKER_USER_ROOT must be set (stack.ps1 exports it)}/Data/viking-certs/webroot}:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
