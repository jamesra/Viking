<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  body { font-family: Segoe UI, sans-serif; background: #1e1e1e; color: #ddd; margin: 0; padding: 1rem 2rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  .meta { color: #999; font-size: .85rem; margin-bottom: 1.5rem; }
  .summary { border-collapse: collapse; margin-bottom: 2rem; }
  .summary th, .summary td { padding: .25rem .75rem; border-bottom: 1px solid #333; text-align: left; font-size: .9rem; }
  .case { border-top: 2px solid #444; padding: 1rem 0 2rem; }
  .case h2 { font-size: 1.1rem; margin: 0; }
  .case h2 a { color: #ddd; text-decoration: none; }
  .desc { color: #aaa; margin: .25rem 0 .75rem; }
  .report { font-family: Consolas, monospace; font-size: .8rem; color: #bbb; white-space: pre-wrap; margin: .25rem 0 1rem; }
  .shot { margin-bottom: 1rem; }
  .shot h3 { font-size: .95rem; margin: 0 0 .25rem; font-weight: normal; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
  .row figure { margin: 0; }
  .row figcaption { font-size: .75rem; color: #999; margin-bottom: .2rem; }
  .row img { width: 100%; border: 1px solid #333; cursor: zoom-in; background: #222; }
  .row img.zoom { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; z-index: 10; background: #000; cursor: zoom-out; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: .6rem; font-size: .75rem; margin-left: .5rem; vertical-align: middle; }
  .unchanged { background: #2d5a2d; } .changed { background: #8a5a00; } .missing { background: #7a2020; } .new { background: #2d4a7a; }
  .judge { margin: .5rem 0 0; font-size: .85rem; color: #ccc; }
  .judge label { margin-right: 1rem; }
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<div class="meta">Generated {{GENERATED}} &middot; capture {{OUTPUT}} &middot; baselines {{BASELINES}} &middot; changed-pixel threshold {{THRESHOLD}}%</div>
<table class="summary">
<tr><th>Case</th><th>Verdict</th><th>Max diff</th><th>Baseline final</th><th>New final</th></tr>
{{SUMMARY}}
</table>
{{CASES}}
<script>
  document.querySelectorAll('.row img').forEach(img => img.addEventListener('click', () => img.classList.toggle('zoom')));
</script>
</body>
</html>
