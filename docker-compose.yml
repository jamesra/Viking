# Dev convenience: the Viking service stacks in one compose project.
#
# Production and the normal dev workflow run each stack on its own through nornir-docker's
# stack.ps1 (registry: deploy/stacks.psd1), for example `stack.ps1 up viking-annotation`.
# This file just includes those per-stack files so `docker compose config` / `up <service>` from the
# repo root keeps working. It needs the same variables stack.ps1 exports (NORNIR_DOCKER_USER_ROOT,
# STACK_RUN_DIR, STACK_DATA_DIR, STACK_LOGS_DIR, STACK_SECRETS_DIR, DOCKER_CERTS_DIR, TLS_CERT_NAME);
# with one shared STACK_* set, the stacks share one run env and data folder, so prefer stack.ps1.
#
#   Local gRPC annotation + local SQL (integration tests):
#     Servers/GrpcAnnotationService/scripts/Start-AnnotationTestStack.ps1 -ApplySchema -Build
#
# Identity (Servers/IdentityServer/docker-compose-all.yml), the proxy (Servers/proxy) and the
# certificate renewer (Servers/certbot) are separate stacks and are not included here.

include:
  - Servers/GrpcAnnotationService/docker-compose.yml
  - Servers/GrpcSectionCorrectionService/docker-compose.yml
  - Servers/SegmentationServer/docker-compose.yml
