# Local gRPC annotation stack.
# Integration tests (DevTest Identity + annotation-sql):
#   Servers/GrpcAnnotationService/scripts/Start-AnnotationTestStack.ps1 -ApplySchema -Build
# Viking against local gRPC + production Identity:
#   docker compose --env-file D:/Docker/Builds/AnnotationSql/.env \
#     -f docker-compose.yml -f docker-compose.annotation-db.yml \
#     up -d annotation-sql grpc-annotation-service
# See Servers/AnnotationDatabase/config-template/README.md

services:
  # Throwaway Identity Server used only to run the gRPC annotation integration
  # tests locally, so tests don't need to hit the production identity.codepharm.net
  # instance. See Servers/IdentityServer/DevTest/Config.cs for scopes/clients/users.
  identity-devtest:
    build:
      context: .
      dockerfile: Servers/IdentityServer/DevTest/Dockerfile
    ports:
      - "5020:80"
    networks:
      - viking-network

  grpc-annotation-service:
    build:
      context: .
      dockerfile: Servers/GrpcAnnotationService/Dockerfile
    # Real secrets/connection info live outside the repo, see
    # Servers/GrpcAnnotationService/config-template/README.md for setup.
    env_file:
      - D:/Docker/Builds/GrpcAnnotationService/.env.Docker
    ports:
      # 5000/5001 are already used by the identity-server stack on this host.
      # :5010 h2c for tests / modern .NET. :5011 HTTPS for Viking (.NET 4.8 WinHttpHandler).
      - "5010:80"
      - "5011:443"
    volumes:
      - ./Servers/GrpcAnnotationService/appsettings.json:/app/appsettings.json:ro
      - ./Servers/GrpcAnnotationService/appsettings.Development.json:/app/appsettings.Development.json:ro
      - D:/Docker/Builds/GrpcAnnotationService/corrections:/corrections
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=
      - ASPNETCORE_HTTP_PORTS=
      - ASPNETCORE_HTTPS_PORTS=
      - Kestrel__UseDockerPorts=true
      - Corrections__RootDirectory=/corrections
    networks:
      - viking-network

  section-correction-service:
    build:
      context: .
      dockerfile: Servers/GrpcSectionCorrectionService/Dockerfile
    env_file:
      - ${SECTION_CORRECTION_BUILD_ENV_PATH:-D:/Docker/Builds/SectionCorrectionService}/.env.Docker
    ports:
      - "41080:80"
      - "41443:443"
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./Servers/GrpcSectionCorrectionService/appsettings.json:/app/appsettings.json:ro
      - ./Servers/GrpcSectionCorrectionService/appsettings.Development.json:/app/appsettings.Development.json:ro
      - ${SECTION_CORRECTION_CONFIG_PATH:-D:/Docker/mounted-configs/SectionCorrectionService}/corrections:/corrections
      - ${SECTION_CORRECTION_CONFIG_PATH:-D:/Docker/mounted-configs/SectionCorrectionService}/cache:/cache
      - section-correction-letsencrypt:/etc/letsencrypt:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=
      - ASPNETCORE_HTTP_PORTS=
      - ASPNETCORE_HTTPS_PORTS=
      - Kestrel__UseDockerPorts=true
      - Corrections__RootDirectory=/corrections
      - Corrections__CachePath=/cache
      - SSL_CERT_PATH=${SECTION_CORRECTION_SSL_CERT_CONTAINER_PATH:-/etc/letsencrypt/live/corrections.codepharm.net/fullchain.pem}
      - SSL_KEY_PATH=${SECTION_CORRECTION_SSL_KEY_CONTAINER_PATH:-/etc/letsencrypt/live/corrections.codepharm.net/privkey.pem}
    depends_on:
      - section-correction-certbot-renewer
    networks:
      - viking-network

  # Own renewer and volume. Segmentation's cert is for segmentation.codepharm.net and
  # that renewer only restarts segmentation-server. This one starts with the stack.
  # Skip it with: docker compose up -d --no-deps section-correction-service
  #               docker compose stop section-correction-certbot-renewer
  section-correction-certbot-renewer:
    container_name: section-correction-certbot-renewer
    build:
      context: ./Servers/certbot
      dockerfile: Dockerfile
    image: section-correction-certbot-renewer:latest
    restart: unless-stopped
    env_file:
      - ${SECTION_CORRECTION_BUILD_ENV_PATH:-D:/Docker/Builds/SectionCorrectionService}/.env.Docker
    environment:
      - CERTBOT_AUTH_METHOD=${SECTION_CORRECTION_CERTBOT_AUTH_METHOD:-dns-cloudflare}
      - CERTBOT_RESTART_CONTAINER=section-correction-service
      - CF_DNS_API_CREDENTIALS_FILE=${CF_DNS_API_CREDENTIALS_FILE:-/run/secrets/cloudflare.ini}
      - CF_DNS_PROPAGATION_SECONDS=${CF_DNS_PROPAGATION_SECONDS:-60}
    volumes:
      - section-correction-letsencrypt:/etc/letsencrypt
      - section-correction-certbot-lib:/var/lib/letsencrypt
      - section-correction-certbot-logs:/var/log/letsencrypt
      - type: bind
        source: ${CF_DNS_API_CREDENTIALS_HOST_PATH:-D:/Docker/Builds/cloudflare.ini}
        target: /run/secrets/cloudflare.ini
        read_only: true
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-//var/run/docker.sock}
        target: /var/run/docker.sock
    entrypoint: ["bash", "/opt/identity-certbot/renew-loop.sh"]
    networks:
      - viking-network

  segmentation-server:
    build:
      context: .
      dockerfile: Servers/SegmentationServer/Dockerfile
    restart: unless-stopped
    command: ["--port", "80"]
    ports:
      # Cleartext gRPC. Host 443/80 belong to the reverse proxy.
      - "40080:80"
      # Router forwards segmentation.codepharm.net:443 to this host port.
      - "40443:443"
    cap_add:
      - NET_BIND_SERVICE
    gpus: all
    environment:
      TORCHINDUCTOR_CACHE_DIR: /home/user/.cache/torch_inductor
      TORCHINDUCTOR_FX_GRAPH_CACHE: "1"
      TRITON_CACHE_DIR: /home/user/.cache/torch_inductor/triton
      TORCHINDUCTOR_PERSISTENT_AUTOTUNE_DIR: /home/user/.cache/torch_inductor/autotune
      SSL_CERT_PATH: ${SEGMENTATION_SSL_CERT_CONTAINER_PATH:-/etc/letsencrypt/live/segmentation.codepharm.net/fullchain.pem}
      SSL_KEY_PATH: ${SEGMENTATION_SSL_KEY_CONTAINER_PATH:-/etc/letsencrypt/live/segmentation.codepharm.net/privkey.pem}
      SAM2_CHECKPOINT: ${SAM2_CHECKPOINT:-/models/best_TEM_model.pt}
    volumes:
      - ${SEGMENTATION_MODEL_HOST:-D:/Docker/Run/segmentation-server}:/models:ro
      - ${SEGMENTATION_INDUCTOR_CACHE:-D:/Docker/cache/segmentation-inductor}:/home/user/.cache/torch_inductor
      - segmentation-letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - viking-network

  # Started only with: docker compose --profile letsencrypt up -d
  # Requires D:\Docker\Builds\SegmentationServer\.env (see config-template).
  segmentation-certbot-renewer:
    profiles: ["letsencrypt"]
    container_name: segmentation-certbot-renewer
    build:
      context: ./Servers/certbot
      dockerfile: Dockerfile
    image: segmentation-certbot-renewer:latest
    restart: unless-stopped
    env_file:
      - ${SEGMENTATION_BUILD_ENV_PATH:-D:/Docker/Builds/SegmentationServer}/.env
    environment:
      - CERTBOT_AUTH_METHOD=${CERTBOT_AUTH_METHOD:-dns-cloudflare}
      - CERTBOT_RESTART_CONTAINER=${CERTBOT_RESTART_CONTAINER:-segmentation-server}
      - CF_DNS_API_CREDENTIALS_FILE=${CF_DNS_API_CREDENTIALS_FILE:-/run/secrets/cloudflare.ini}
      - CF_DNS_PROPAGATION_SECONDS=${CF_DNS_PROPAGATION_SECONDS:-60}
    volumes:
      - segmentation-letsencrypt:/etc/letsencrypt
      - segmentation-certbot-lib:/var/lib/letsencrypt
      - segmentation-certbot-logs:/var/log/letsencrypt
      - type: bind
        source: ${CF_DNS_API_CREDENTIALS_HOST_PATH:-D:/Docker/Builds/cloudflare.ini}
        target: /run/secrets/cloudflare.ini
        read_only: true
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-//var/run/docker.sock}
        target: /var/run/docker.sock
    entrypoint: ["bash", "/opt/identity-certbot/renew-loop.sh"]
    networks:
      - viking-network

networks:
  viking-network:
    driver: bridge

volumes:
  segmentation-letsencrypt:
  segmentation-certbot-lib:
  segmentation-certbot-logs:
  section-correction-letsencrypt:
  section-correction-certbot-lib:
  section-correction-certbot-logs:
