# Annotation SQL Server for local gRPC integration tests.
# Use with the root compose file:
#   docker compose --env-file D:/Docker/Builds/AnnotationSql/.env \
#     -f docker-compose.yml -f docker-compose.annotation-db.yml \
#     up --build identity-devtest annotation-sql grpc-annotation-service
#
# Or run Servers/GrpcAnnotationService/scripts/Start-AnnotationTestStack.ps1
#
# Env template: Servers/AnnotationDatabase/config-template/

services:
  annotation-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: viking-annotation-sql
    env_file:
      - D:/Docker/Builds/AnnotationSql/.env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - annotation-sql-data:/var/opt/mssql
      - ./Servers/AnnotationDatabase/scripts:/scripts:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - viking-network

  grpc-annotation-service:
    depends_on:
      annotation-sql:
        condition: service_healthy
      identity-devtest:
        condition: service_started
    # Override ConnectionStrings / Identity when running the local test stack.
    # ${MSSQL_SA_PASSWORD} and ${ANNOTATION_DATABASE} come from
    # `docker compose --env-file D:/Docker/Builds/AnnotationSql/.env ...`
    environment:
      # HTTP-only in the test stack — the container image has no HTTPS cert.
      # Host tests use http://localhost:5010 (mapped from container :80).
      ASPNETCORE_URLS: "http://+:80"
      ConnectionStrings__AnnotationConnection: "Server=annotation-sql,1433;Database=${ANNOTATION_DATABASE:-AnnotationTest};User ID=sa;Password=${MSSQL_SA_PASSWORD};MultipleActiveResultSets=true;TrustServerCertificate=True"
      # Reach DevTest Identity on the compose network (not host.docker.internal).
      IdentityServer__Endpoint: "http://identity-devtest/"
      IdentityServer__IntrospectionEndpoint: "http://identity-devtest/connect/introspect"
      IdentityServer__ClientId: "grpc-annotation"
      IdentityServer__ClientSecret: "DevTestIntrospectionSecret"
      IdentityServer__AllowHttpMetadata: "true"

volumes:
  annotation-sql-data:
